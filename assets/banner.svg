<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b5876">
        <animate attributeName="stop-color" values="#2b5876;#4e4376;#2b5876" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#4e4376">
        <animate attributeName="stop-color" values="#4e4376;#2b5876;#4e4376" dur="5s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>
  <rect width="800" height="200" fill="url(#bg)" rx="15"/>
  <text x="50%" y="45%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#ffffff">
    India Tech Engineering Workforce
  </text>
  <text x="50%" y="70%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#dddddd">
    FAANG vs GCC vs IT Services
  </text>
</svg>
